<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" id="favicon_link" href="/privateimages/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- DNS prefetch to an IP Address and preconnect for API endpoint -->
  <!-- for old browser support, we keep the dns-prefetch for the API endpoint domain -->
  <link rel="dns-prefetch" href="https://service.netzoom.com" />

  <!-- in modern browser, ignores dns-prefetch for the API endpoint domain -->
  <!-- resolving the DNS, and establishing the full connection to the server (TCP handshake and TLS negotiation for HTTPS). The crossorigin attribute indicates that requests to this domain will include cross-origin resource sharing (CORS) headers -->
  <link rel="preconnect" href="https://service.netzoom.com" crossorigin />

  <title id="nz_title_tab"></title>
  <script src="/config.js"></script>
</head>

<body>
  <div id="root">
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
